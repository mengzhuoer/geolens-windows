name: Bug 报告
description: 使用或构建中遇到的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先查看 `docs/FAQ.md`。日志在 `data\logs\`（desktop.log / api.log / worker.log / librarian.log），提交前请脱敏路径与账号。
  - type: dropdown
    id: artifact
    attributes:
      label: 发行物
      options:
        - 免安装 ZIP（GeoLens.exe）
        - 安装包
        - 源码构建
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 例如 1.2.8（控制台或 data/config.json 可见）
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 双击 GeoLens.exe
        2. 拖入 xxx.tif
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / 报错
      description: 可粘贴日志片段（注意脱敏）
    validations:
      required: true
